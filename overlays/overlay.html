<!doctype html>
<html><head><meta charset="utf-8"><title>LawWorld overlay</title>
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:transparent;}
  body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;}
  .abs{position:absolute;left:0;top:0;}
  .hidden{opacity:0;}
  /* cinematic scrims: seat captions + lower third, hide the corner mark */
  #scrim-top{width:1080px;height:300px;background:linear-gradient(180deg,rgba(4,3,10,.42),rgba(4,3,10,0));}
  #scrim-bot{top:1420px;width:1080px;height:500px;background:linear-gradient(0deg,rgba(4,3,10,.78) 0%,rgba(4,3,10,.45) 45%,rgba(4,3,10,0) 100%);}
  /* sting */
  #sting{width:1080px;height:1920px;background:#07060D;}
  #sting .glow{position:absolute;left:140px;top:560px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,240,.55) 0%,rgba(91,75,214,.28) 30%,rgba(7,6,13,0) 68%);filter:blur(10px);}
  #sting .ring{position:absolute;left:390px;top:730px;width:300px;height:300px;border-radius:50%;border:1.5px solid rgba(215,218,227,.45);}
  #sting .mark{position:absolute;left:400px;top:740px;width:280px;height:258px;background:url(../brand/mark_indigo.png) center/contain no-repeat;filter:drop-shadow(0 30px 60px rgba(60,40,160,.55));}
  #sting .word{position:absolute;left:245px;top:1030px;width:590px;height:170px;background:url(../brand/wordmark_white.png) center/contain no-repeat;}
  #sting .tag{position:absolute;left:0;top:1215px;width:1080px;text-align:center;font-size:30px;letter-spacing:9px;text-transform:uppercase;color:rgba(215,218,227,.85);font-weight:500;}
  /* lower third */
  .lt{left:64px;top:1225px;width:600px;height:140px;border-radius:24px;background:rgba(12,10,24,.66);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;}
  .lt .bar{position:absolute;left:0;top:0;width:6px;height:140px;background:linear-gradient(180deg,#8B7CFF,#4B3FA6);}
  .lt .mk{position:absolute;left:30px;top:34px;width:78px;height:72px;background:url(../brand/mark_indigo.png) center/contain no-repeat;}
  .lt .name{position:absolute;left:130px;top:30px;font-size:46px;font-weight:600;letter-spacing:-.5px;}
  .lt .role{position:absolute;left:130px;top:86px;font-size:29px;font-weight:400;color:rgba(255,255,255,.66);letter-spacing:.2px;}
  /* pills */
  .pills{left:0;top:130px;width:1080px;height:100px;display:flex;justify-content:center;gap:18px;}
  .pill{height:88px;padding:0 38px;border-radius:44px;background:rgba(14,12,28,.62);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:14px;font-size:40px;font-weight:600;letter-spacing:-.3px;box-shadow:0 14px 40px rgba(0,0,0,.35);}
  .pill .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#B9AEFF,#6C5CE7);box-shadow:0 0 18px rgba(139,124,255,.9);}
  /* lockup */
  .lockup{left:0;top:96px;width:1080px;height:150px;}
  .lockup .in{position:relative;margin:0 auto;width:640px;height:150px;}
  .lockup .mk{position:absolute;left:0;top:10px;width:140px;height:129px;background:url(../brand/mark_indigo.png) center/contain no-repeat;filter:drop-shadow(0 12px 30px rgba(60,40,160,.5));}
  .lockup .wd{position:absolute;left:150px;top:5px;width:490px;height:140px;background:url(../brand/wordmark_white.png) center/contain no-repeat;}
  .lockup .sweep{position:absolute;left:150px;top:5px;width:490px;height:140px;-webkit-mask:url(../brand/wordmark_white.png) center/contain no-repeat;background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(200,190,255,.95) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;}
  /* big number */
  .bignum{left:0;top:940px;width:1080px;height:560px;text-align:center;background:radial-gradient(ellipse 60% 55% at 50% 45%,rgba(7,6,13,.55) 0%,rgba(7,6,13,.35) 45%,rgba(7,6,13,0) 75%);}
  .bignum .n{font-size:340px;font-weight:700;letter-spacing:-16px;line-height:1;background:linear-gradient(180deg,#FFFFFF 10%,#D7DAE3 55%,#9C96B8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(139,124,255,.55));display:inline-block;}
  .bignum .rule{width:180px;height:3px;margin:24px auto 30px;background:linear-gradient(90deg,rgba(139,124,255,0),#8B7CFF,rgba(139,124,255,0));}
  .bignum .l{font-size:60px;font-weight:300;letter-spacing:12px;text-transform:uppercase;color:rgba(255,255,255,.92);}
  /* chapter label */
  .chapter{left:0;top:118px;width:1080px;text-align:center;font-size:30px;letter-spacing:7px;text-transform:uppercase;color:rgba(215,218,227,.9);font-weight:500;display:flex;justify-content:center;align-items:center;gap:26px;}
  .chapter i{display:block;width:56px;height:1.5px;background:rgba(215,218,227,.5);}
  /* chips */
  .chips{left:0;top:0;width:1080px;height:1920px;}
  .chip{position:absolute;left:690px;width:330px;height:96px;border-radius:22px;background:rgba(12,10,24,.64);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:18px;padding:0 22px;box-sizing:border-box;box-shadow:0 16px 44px rgba(0,0,0,.4);}
  .chip .ic{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,rgba(139,124,255,.35),rgba(75,63,166,.35));border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;}
  .chip .ic svg{width:32px;height:32px;stroke:#EDEBFF;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .chip .t{font-size:34px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;}
  /* captions */
  .caps{left:60px;top:1530px;width:960px;text-align:center;font-size:58px;font-weight:600;letter-spacing:-.6px;line-height:1.22;text-shadow:0 4px 26px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6);}
  .caps span{display:inline-block;margin:0 9px;color:rgba(255,255,255,.62);transition:none;}
  .caps span.on{color:#FFFFFF;}
  .caps span.done{color:rgba(255,255,255,.92);}
  /* end card */
  .end{left:0;top:0;width:1080px;height:1920px;background:linear-gradient(0deg,rgba(7,6,13,.92) 0%,rgba(7,6,13,.7) 30%,rgba(7,6,13,.15) 60%,rgba(7,6,13,0) 100%);}
  .end .mk{position:absolute;left:440px;top:1080px;width:200px;height:184px;background:url(../brand/mark_indigo.png) center/contain no-repeat;filter:drop-shadow(0 24px 50px rgba(60,40,160,.55));}
  .end .wd{position:absolute;left:290px;top:1290px;width:500px;height:144px;background:url(../brand/wordmark_white.png) center/contain no-repeat;}
  .end .u{position:absolute;left:0;top:1450px;width:1080px;text-align:center;font-size:34px;letter-spacing:8px;text-transform:uppercase;color:rgba(215,218,227,.85);font-weight:500;}
</style></head>
<body>
<div id="stage"></div>
<script>
// ---------- easing ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const outBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const outCubic=x=>1-Math.pow(1-x,3);
const inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const P=(t,t0,d)=>clamp((t-t0)/d);
const ICONS={
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z"/><path d="M8 8.5h8M8 12h5"/></svg>',
  draft:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 15.5l6-6 1.5 1.5-6 6H9.5z"/></svg>',
  research:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/><path d="M8 10.5h5M10.5 8v5"/></svg>',
  translate:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2 2 0 0 1 6 3.5h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20.5V5.5M8 7.5h7"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>'
};
let CUES=[], EL=[];
const stage=document.getElementById('stage');
function div(cls,html){const d=document.createElement('div');d.className='abs '+(cls||'');if(html!==undefined)d.innerHTML=html;stage.appendChild(d);return d;}
function init(tl){
  stage.innerHTML='';CUES=tl.cues;EL=[];
  const scrimT=div('',''); scrimT.id='scrim-top'; const scrimB=div(''); scrimB.id='scrim-bot';
  EL.push({type:'_scrim',el:[scrimT,scrimB],t0:tl.scrim_from??0,t1:tl.duration});
  for(const c of CUES){
    if(c.type==='sting'){const e=div('');e.id='sting';e.innerHTML='<div class="glow"></div><div class="ring"></div><div class="mark"></div><div class="word"></div><div class="tag">'+(c.tag||'AI platform for advocates')+'</div>';EL.push({c,el:e,q:{glow:e.querySelector('.glow'),ring:e.querySelector('.ring'),mark:e.querySelector('.mark'),word:e.querySelector('.word'),tag:e.querySelector('.tag')}});}
    else if(c.type==='lower_third'){const e=div('lt','<div class="bar"></div><div class="mk"></div><div class="name">'+c.name+'</div><div class="role">'+c.role+'</div>');EL.push({c,el:e});}
    else if(c.type==='pills'){const e=div('pills',c.items.map(i=>'<div class="pill"><div class="dot"></div>'+i.text+'</div>').join(''));EL.push({c,el:e,items:[...e.querySelectorAll('.pill')]});}
    else if(c.type==='lockup'){const e=div('lockup','<div class="in"><div class="mk"></div><div class="wd"></div><div class="sweep"></div></div>');EL.push({c,el:e,q:{mk:e.querySelector('.mk'),wd:e.querySelector('.wd'),sw:e.querySelector('.sweep')}});}
    else if(c.type==='bignum'){const e=div('bignum','<div class="n">'+c.num+'</div><div class="rule"></div><div class="l">'+c.label+'</div>');EL.push({c,el:e,q:{n:e.querySelector('.n'),r:e.querySelector('.rule'),l:e.querySelector('.l')}});}
    else if(c.type==='chapter'){const e=div('chapter','<i></i><span>'+c.text+'</span><i></i>');EL.push({c,el:e});}
    else if(c.type==='chips'){const e=div('chips',c.items.map((i,k)=>'<div class="chip" style="top:'+((c.top??380)+k*114)+'px"><div class="ic">'+(ICONS[i.icon]||'')+'</div><div class="t">'+i.text+'</div></div>').join(''));EL.push({c,el:e,items:[...e.querySelectorAll('.chip')]});}
    else if(c.type==='captions'){const e=div('caps','');EL.push({c,el:e,phrases:groupWords(c.words,c),cur:-1});}
    else if(c.type==='endcard'){const e=div('end','<div class="mk"></div><div class="wd"></div><div class="u">'+(c.url||'lawworld.ai')+'</div>');EL.push({c,el:e,q:{mk:e.querySelector('.mk'),wd:e.querySelector('.wd'),u:e.querySelector('.u')}});}
  }
  return EL.length;
}
function groupWords(words,c){
  const maxW=c.max_words||4, maxD=c.max_dur||1.7; const out=[]; let cur=null;
  for(const w of words){
    const txt=(w.word||'').trim(); if(!txt) continue;
    const endsSent=/[.!?]$/.test(txt);
    if(!cur||cur.words.length>=maxW||(w.end-cur.start)>maxD){cur={start:w.start,end:w.end,words:[]};out.push(cur);}
    cur.words.push({t:txt,s:w.start,e:w.end}); cur.end=w.end;
    if(endsSent) cur=null;
  }
  // hold each phrase until the next starts (if the gap is short)
  for(let i=0;i<out.length-1;i++){const gap=out[i+1].start-out[i].end; out[i].hold=gap<0.6?out[i+1].start:out[i].end+0.35;}
  if(out.length) out[out.length-1].hold=out[out.length-1].end+0.6;
  return out;
}
function show(el,on){el.style.visibility=on?'visible':'hidden';}
function seek(t){
  let active=false;
  for(const x of EL){
    if(x.type==='_scrim'){const on=t>=x.t0&&t<=x.t1;x.el.forEach(e=>{show(e,on);e.style.opacity=on?String(P(t,x.t0,0.4)):'0';});if(on)active=true;continue;}
    const c=x.c,el=x.el; const on=t>=c.t0&&t<=c.t1; show(el,on); if(!on) continue; active=true;
    const tin=t-c.t0, tout=c.t1-t; const fo=c.fade_out??0.35; const outA=clamp(tout/fo);
    switch(c.type){
      case 'sting':{
        const a=P(t,c.t0,0.7); const b=P(t,c.t0+0.45,0.7); const g=P(t,c.t0+1.05,0.6);
        x.q.mark.style.transform=`scale(${0.55+0.45*outBack(a)}) rotate(${-10*(1-outCubic(a))}deg)`; x.q.mark.style.opacity=String(clamp(a*2));
        x.q.ring.style.transform=`scale(${0.6+1.9*outExpo(P(t,c.t0+0.25,1.2))})`; x.q.ring.style.opacity=String(0.6*(1-P(t,c.t0+0.25,1.2)));
        x.q.glow.style.transform=`scale(${0.8+0.25*Math.sin((t-c.t0)*1.4)})`; x.q.glow.style.opacity=String(clamp(a*1.5)*0.95);
        x.q.word.style.opacity=String(outCubic(b)); x.q.word.style.transform=`translateX(${40*(1-outExpo(b))}px)`; x.q.word.style.filter=`blur(${14*(1-outExpo(b))}px)`;
        x.q.tag.style.opacity=String(outCubic(g)); x.q.tag.style.transform=`translateY(${16*(1-outExpo(g))}px)`; x.q.tag.style.letterSpacing=`${9+6*(1-outExpo(g))}px`;
        el.style.opacity=String(outA); break;}
      case 'lower_third':{const a=outExpo(P(t,c.t0,0.55)); el.style.opacity=String(Math.min(a,outA)); el.style.transform=`translateY(${(1-a)*46+(1-outA)*30}px)`; break;}
      case 'pills':{el.style.opacity=String(outA); x.items.forEach((p,k)=>{const at=c.items[k].at??c.t0; const a=P(t,at,0.45); p.style.opacity=String(clamp(a*2)); p.style.transform=`scale(${0.7+0.3*outBack(a)}) translateY(${(1-outExpo(a))*14}px)`;}); break;}
      case 'lockup':{const a=outExpo(P(t,c.t0,0.6)); el.style.opacity=String(Math.min(clamp(a*1.5),outA)); el.style.transform=`translateY(${(1-a)*-34}px)`; const s=P(t,c.t0+0.5,1.0); x.q.sw.style.opacity=String(s>0&&s<1?1:0); x.q.sw.style.backgroundPosition=`${100-200*s}% 0`; break;}
      case 'bignum':{const a=P(t,c.t0,0.9); const n=parseInt(c.num)||0; const shown=Math.round(n*outCubic(a)); const plus=c.num.replace(/^\d+/,''); x.q.n.textContent=(a<1?shown:n)+(a>=0.85?plus:''); x.q.n.style.transform=`translateY(${(1-outExpo(P(t,c.t0,0.8)))*40 - (t-c.t0)*1.2}px) scale(${0.92+0.08*outExpo(P(t,c.t0,0.8))})`; x.q.n.style.opacity=String(clamp(a*3)); const r=P(t,c.t0+0.5,0.5); x.q.r.style.transform=`scaleX(${outExpo(r)})`; x.q.r.style.opacity=String(r); const l=P(t,c.t0+0.7,0.6); x.q.l.style.opacity=String(outCubic(l)); x.q.l.style.transform=`translateY(${(1-outExpo(l))*18}px)`; el.style.opacity=String(outA); break;}
      case 'chapter':{const a=outExpo(P(t,c.t0,0.5)); el.style.opacity=String(Math.min(a,outA)); el.style.transform=`translateY(${(1-a)*-14}px)`; break;}
      case 'chips':{el.style.opacity=String(outA); x.items.forEach((p,k)=>{const at=c.items[k].at??c.t0; const a=P(t,at,0.5); p.style.opacity=String(clamp(a*2)); p.style.transform=`translateX(${(1-outExpo(a))*70}px) scale(${0.94+0.06*outBack(a)})`;}); break;}
      case 'captions':{const ph=x.phrases.find(p=>t>=p.start-0.12&&t<=p.hold); if(!ph){el.style.opacity='0';break;} const idx=x.phrases.indexOf(ph); if(x.cur!==idx){el.innerHTML=ph.words.map(w=>'<span>'+w.t+'</span>').join('');x.cur=idx;x.spans=[...el.querySelectorAll('span')];}
        const a=outExpo(P(t,ph.start-0.12,0.22)); el.style.opacity=String(a); el.style.transform=`translateY(${(1-a)*14}px)`;
        x.spans.forEach((s,k)=>{const w=ph.words[k]; const on=t>=w.s-0.02&&t<w.e+0.05; const done=t>=w.e+0.05; s.className=on?'on':(done?'done':''); const pop=on?1+0.05*Math.sin(Math.PI*clamp((t-w.s)/Math.max(0.18,w.e-w.s))):1; s.style.transform=`scale(${pop})`;}); break;}
      case 'endcard':{const a=outExpo(P(t,c.t0,0.7)); el.style.opacity=String(Math.min(a,outA)); const b=P(t,c.t0+0.15,0.8); x.q.mk.style.transform=`scale(${0.7+0.3*outBack(b)})`; x.q.mk.style.opacity=String(clamp(b*2)); const w=P(t,c.t0+0.45,0.7); x.q.wd.style.opacity=String(outCubic(w)); x.q.wd.style.transform=`translateY(${(1-outExpo(w))*18}px)`; const u=P(t,c.t0+0.9,0.6); x.q.u.style.opacity=String(outCubic(u)); break;}
    }
  }
  return active;
}
window.__init=init; window.__seek=seek;
</script>
</body></html>
