<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LawWorld split panel</title>
<!--
  16:9 one-screen presentation panel for the LawWorld course explainers (1920x1080 @ 24 fps).
  Rendered by scripts/render_overlays.ts: window.__init(timeline) builds every cue, window.__seek(t) poses
  every element as a pure function of t (no CSS transitions / animations / rAF / clocks).
  Layout: one third presenter, two thirds explanation, read as ONE screen. The presenter fills x 0..PX (640), shot against
  the brand cream (split/flatten_bg.py flattens the backdrop to #f5f0e8, compose2.py pads the base with 0xf5f0e8); the panel
  is x PX..1920 on the same opaque cream. At rest nothing marks the seam at x = PX: no divider, the panel's living blobs and
  star watermark fade out within CLEAR px of it, and a FEATHER px strip (transparent -> cream) over the presenter's right edge
  hides what is left of any backdrop mismatch. No cue may enter from or be clipped at the seam (the panel clips there).
  Every layout number lives in the GEOMETRY block at the top of the script and is mirrored to CSS custom properties on :root.
  Presenter x 0..PX stays transparent apart from the feather, the lower third and the full-frame sting / endcard.
  Layers: panel chrome < panel content (cue order) < seam feather < presenter cues < sting/endcard.
  RGBA guard: #stage never paints its bottom-right pixel and #guard fills it with 99 % cream (alpha 252), so every PNG is RGBA.
  Chrome saves a fully opaque frame (sting / endcard) as RGB, and ffmpeg re-initialises the overlay graph when a sequence
  switches between RGB and RGBA, which dropped the overlay for two frames in the first motion test. (A fully transparent
  pixel let compose2's black lead show as a black corner dot under the opening sting.)
  The earlier 55 / 45 layout with a copper divider is in git at 90c2eb0.
-->
<style>
  @font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;src:url(../brand/fonts/Instrument_Serif_jizBRFtNs2ka5fXjeivQ4LroWlx-6zUTjnTLgNs.woff2) format("woff2");}
  @font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;src:url(../brand/fonts/Instrument_Serif_jizHRFtNs2ka5fXjeivQ4LroWlx-6zAjjH7Motmp5g.woff2) format("woff2");}
  @font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;src:url(../brand/fonts/Manrope_xn7gYHE41ni1AdIRggexSvfedN4.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;src:url(../brand/fonts/Manrope_xn7gYHE41ni1AdIRggmxSvfedN62Zw.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  :root{--cream:#f5f0e8;--cream-deep:#ede6d9;--paper:#fffcf6;--ink:#1f1e1d;--ink-soft:#2a2624;--muted:#6b6660;--rule:#e0d7c6;
        --accent:#cc785c;--accent-deep:#b3573f;--accent-soft:#e8bfa9;--wash:#f5dfd0;--brand:#d97757;--red:#c0392b;
        --serif:"Instrument Serif","Times New Roman",Georgia,serif;--sans:"Manrope",-apple-system,"Helvetica Neue",Arial,sans-serif;
        --copper:linear-gradient(135deg,#de8a6a 0%,var(--brand) 38%,var(--accent-deep) 100%);}
  /* layout geometry (--px --pw --cl --cw --feather --over --clear --ramp --head-y --head-h --rule-y --kick-y --cite-b --lt-x --lt-y --lt-w --edge-w --eq-w)
     is written onto :root by the GEOMETRY block in the script: change it there, never here */
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:transparent;}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .serif{font-family:var(--serif);font-weight:400;}
  em,.em{font-style:italic;color:var(--accent-deep);}
  img{display:block;}
  .pre{position:absolute;left:-9999px;top:0;width:8px;height:8px;}
  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;
    clip-path:polygon(0 0,1920px 0,1920px 1079px,1919px 1079px,1919px 1080px,0 1080px);}  /* 1 px RGBA guard, see header note */
  #guard{position:absolute;left:1919px;top:1079px;width:1px;height:1px;background:rgba(245,240,232,.99);}
  #pwrap{position:absolute;left:var(--px);top:0;width:var(--pw);height:1080px;overflow:hidden;}
  #pin{position:absolute;left:0;top:0;width:var(--pw);height:1080px;transform-origin:50% 45%;}
  #pbase,#pcontent{position:absolute;left:0;top:0;width:var(--pw);height:1080px;}
  #pcontent{isolation:isolate;}   /* the stamp's multiply resolves inside the content group, not against the composited blob layers:
                                     identical frames from run to run (otherwise up to 2-level differences on stamp frames) */
  #pedge{position:absolute;left:calc(var(--px) - var(--feather));top:0;width:var(--feather);height:1080px;}
  #pres,#top{position:absolute;left:0;top:0;width:1920px;height:1080px;}
  .mk img{width:100%;height:100%;}
  .wd{position:relative;overflow:hidden;flex:none;}
  .wd img{position:absolute;max-width:none;filter:url(#wmclean);}

  /* ---------- panel chrome ---------- */
  .pchrome{position:absolute;left:0;top:0;width:var(--pw);height:1080px;}
  /* opaque cream everywhere in the panel, with --over px to spare on every side so the stamp shake never shows an edge */
  .pbg{position:absolute;left:calc(-1 * var(--over));top:calc(-1 * var(--over));width:calc(var(--pw) + 2 * var(--over));height:calc(1080px + 2 * var(--over));background:var(--cream);overflow:hidden;}
  /* living layer (blobs + star) under a cream veil: flat cream within --clear px of the seam, the blobs at full strength --ramp px
     further in. Over the flat cream base the veil equals masking the blobs, but stays a plain background - a CSS mask-image put
     the layer on another raster path and frames were no longer byte-identical from run to run */
  .pbg .pbl{position:absolute;left:0;top:0;width:100%;height:100%;}
  .pbg .pveil{position:absolute;left:0;top:0;width:calc(var(--over) + var(--clear));height:100%;background:var(--cream);}   /* solid: no dither at the seam */
  .pbg .pramp{position:absolute;left:calc(var(--over) + var(--clear));top:0;width:var(--ramp);height:100%;background:linear-gradient(90deg,var(--cream),rgba(245,240,232,0));}
  /* the drifting blobs / star are their own compositor layers: rasterised once, only moved per frame (re-rasterising the moving
     gradients every frame left 1-6 level dither differences between otherwise identical renders) */
  .pbg .blob,.pbg .wst,.full .fw,.full .fst{will-change:transform;}
  .pbg .blob{position:absolute;left:0;top:0;border-radius:50%;}
  .pbg .b1{width:1000px;height:1000px;background:radial-gradient(circle,rgba(245,223,208,.95) 0%,rgba(245,223,208,.45) 34%,rgba(245,223,208,0) 66%);}
  .pbg .b2{width:1100px;height:1100px;background:radial-gradient(circle,rgba(255,252,246,.95) 0%,rgba(255,252,246,.5) 36%,rgba(255,252,246,0) 66%);}
  .pbg .b3{width:820px;height:820px;background:radial-gradient(circle,rgba(232,191,169,.40) 0%,rgba(232,191,169,0) 64%);}
  .pbg .wst{position:absolute;left:0;top:0;width:680px;height:680px;overflow:visible;}
  .pbg .wst path{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.20;}
  .pbg .wst path.s2{opacity:.12;}
  .pbg .wst circle{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:2 10;opacity:.28;}
  /* seam feather over the presenter's right edge: transparent -> the panel cream on a smoothstep curve (no hard start line), the last
     pixel column fully cream so nothing of the footage touches the seam */
  .feather{position:absolute;left:0;top:0;width:var(--feather);height:1080px;background:linear-gradient(90deg,rgba(245,240,232,0) 0%,rgba(245,240,232,.043) 12.5%,
    rgba(245,240,232,.156) 25%,rgba(245,240,232,.316) 37.5%,rgba(245,240,232,.5) 50%,rgba(245,240,232,.684) 62.5%,rgba(245,240,232,.844) 75%,
    rgba(245,240,232,.957) 87.5%,var(--cream) calc(100% - 1px));}
  .phead{position:absolute;left:var(--cl);top:var(--head-y);width:var(--cw);height:var(--head-h);}
  .plk{position:absolute;left:0;top:3px;height:56px;display:flex;align-items:center;gap:16px;}
  .plk .mk{width:56px;height:56px;flex:none;filter:drop-shadow(0 5px 10px rgba(120,60,30,.22));}
  .chip{position:absolute;right:0;top:3px;height:56px;border-radius:28px;background:var(--wash);box-shadow:inset 0 0 0 1.5px rgba(179,87,63,.16);perspective:360px;overflow:hidden;transform-origin:100% 50%;}
  .chip .face{position:absolute;left:0;top:0;height:56px;display:flex;align-items:center;gap:13px;padding:0 25px 0 9px;white-space:nowrap;transform-origin:50% 50%;backface-visibility:hidden;}
  .chip .num{width:38px;height:38px;border-radius:50%;background:var(--copper);color:#fff;font-weight:800;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;}
  .chip .lab{font-weight:800;font-size:24px;letter-spacing:2.9px;color:var(--accent-deep);text-transform:uppercase;line-height:1;}
  .chip .face.nonum{padding-left:25px;}
  .chip .face.tight .lab{letter-spacing:1px;}
  .prule{position:absolute;left:var(--cl);top:var(--rule-y);width:var(--cw);height:2px;background:var(--rule);transform-origin:0 50%;}
  .prule .fill{position:absolute;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--brand),var(--accent-deep));}

  /* ---------- shared content (every column cue spans the content column --cl / --cw) ---------- */
  .cue{position:absolute;left:0;top:0;transform-origin:50% 50%;}
  .card{background:var(--paper);border:1.5px solid var(--rule);border-radius:30px;box-shadow:0 24px 58px rgba(60,40,25,.12),0 3px 8px rgba(60,40,25,.06);}
  .tile{width:92px;height:92px;border-radius:26px;background:var(--wash);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1.5px rgba(179,87,63,.12);}
  .tile svg{width:46px;height:46px;}
  .wm{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .1em .16em;margin:-.06em -.1em -.16em;}
  .wi{display:inline-block;transform-origin:0 100%;}
  .rel{position:relative;}

  /* title */
  .ttl{left:var(--cl);width:var(--cw);transform-origin:0 50%;}
  .ttl .h{font-size:168px;line-height:.94;letter-spacing:.6px;color:var(--ink);text-wrap:balance;}
  .ttl .ul{width:180px;height:7px;border-radius:4px;background:var(--copper);margin-top:40px;transform-origin:0 50%;}
  .ttl .s{font-size:48px;line-height:1.3;font-weight:500;color:var(--muted);margin-top:34px;max-width:calc(var(--cw) - 100px);text-wrap:balance;}

  /* question */
  .qa{left:var(--cl);width:var(--cw);}
  .qa .qcard{position:relative;padding:98px 70px 76px;}
  .qa .qt{font-size:106px;line-height:1.05;color:var(--ink);text-wrap:balance;}
  .qa .w{position:relative;}
  .qa .hlq{font-style:italic;color:var(--ink);background-image:linear-gradient(var(--accent),var(--accent));background-repeat:no-repeat;background-position:0 96%;background-size:0% 8px;}
  .qa .badge,.qa .ring{position:absolute;left:56px;top:-54px;width:108px;height:108px;border-radius:50%;}
  .qa .badge{background:var(--copper);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 34px rgba(179,87,63,.35);}
  .qa .badge svg{width:54px;height:54px;stroke-width:2.1;}
  .qa .ring{border:3.5px solid var(--accent);box-sizing:border-box;}

  /* stamp */
  .stamp{left:0;top:0;width:var(--pw);height:1px;mix-blend-mode:multiply;}
  .stamp .si{position:absolute;left:0;top:0;color:var(--red);border:14px double var(--red);border-radius:22px;padding:16px 36px 18px;text-align:center;white-space:nowrap;filter:url(#ink);transform-origin:50% 50%;font-size:64px;}
  .stamp .l1{font-weight:800;font-size:1em;letter-spacing:.055em;line-height:1.06;}   /* em: the width fit shrinks .si as a whole */
  .stamp .l2{font-weight:800;font-size:.703em;letter-spacing:.1em;line-height:1.1;margin-top:.155em;}

  /* list (the highlight pill is concentric with the number badges: it reaches 12 px left of the column) */
  .lst{left:var(--cl);width:var(--cw);}
  .lst .lh{font-size:92px;line-height:1.02;color:var(--ink);}
  .lst .lul{width:116px;height:6px;border-radius:3px;background:var(--copper);margin-top:28px;transform-origin:0 50%;}
  .lst .items{position:relative;margin-top:60px;}
  .lst .hlbar{position:absolute;left:-12px;top:0;width:calc(var(--cw) + 24px);height:124px;border-radius:62px;background:rgba(245,223,208,.9);box-shadow:inset 0 0 0 1.5px rgba(179,87,63,.12);transform-origin:0 50%;}
  .lst .it{position:relative;height:124px;display:flex;align-items:center;gap:36px;}
  .lst .it + .it{margin-top:26px;}
  .lst .nb{width:88px;height:88px;border-radius:50%;background:var(--copper);color:#fff;font-weight:800;font-size:40px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 12px 26px rgba(179,87,63,.3);margin-left:6px;}
  .lst .tx{font-size:74px;line-height:1.05;color:var(--ink);white-space:nowrap;}
  .lst .seg{position:absolute;left:48px;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--accent-soft),var(--accent));transform-origin:50% 0;}

  /* strike + point */
  .stk,.pt{left:var(--cl);width:var(--cw);}
  .stk .row,.pt .row{position:relative;display:flex;align-items:center;gap:36px;padding:36px 48px 36px 36px;}
  .stk .tx{position:relative;font-size:70px;line-height:1.12;color:var(--ink);}
  .stk .sbar{position:absolute;height:8px;border-radius:4px;background:var(--red);transform-origin:0 50%;}
  .pt .row{overflow:hidden;padding:40px 48px 40px 36px;}
  .pt .tx{font-size:76px;line-height:1.08;color:var(--ink);}
  .pt.acc .row{background:linear-gradient(120deg,#c9714f 0%,var(--accent) 46%,var(--accent-deep) 100%);border:none;box-shadow:0 28px 64px rgba(179,87,63,.34),0 4px 10px rgba(120,50,30,.12);}
  .pt.acc .tx{color:#fffaf3;}
  .pt.acc .tile{background:rgba(255,250,243,.17);color:#fffaf3;box-shadow:inset 0 0 0 1.5px rgba(255,250,243,.3);}
  .pt .sheen{position:absolute;left:0;top:-30%;width:220px;height:160%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.32) 50%,rgba(255,255,255,0) 100%);}
  .pt:not(.acc) .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--copper);}

  /* kicker */
  .kck{left:var(--cl);top:var(--kick-y);display:flex;align-items:center;gap:20px;white-space:nowrap;transform-origin:0 50%;}
  .kck .bar{width:56px;height:5px;border-radius:3px;background:var(--copper);transform-origin:0 50%;flex:none;}
  .kck .tx{font-weight:800;font-size:29px;letter-spacing:7px;color:var(--accent-deep);text-transform:uppercase;line-height:1.3;}

  /* quote */
  .qt2{left:var(--cl);width:var(--cw);}
  .qt2 .qc{position:relative;padding:84px 62px 50px;}
  .qt2 .qm{position:absolute;left:36px;top:-86px;font-family:var(--serif);font-size:300px;line-height:1;color:var(--accent);height:172px;overflow:visible;text-shadow:0 12px 28px rgba(179,87,63,.18);}
  .qt2 .body{font-size:60px;line-height:1.24;color:var(--ink);}
  .qt2 .w{position:relative;}
  .qt2 .hlw{background-image:linear-gradient(rgba(226,160,128,.42),rgba(226,160,128,.42));background-repeat:no-repeat;background-position:0 88%;background-size:0% 44%;}
  .qt2 .note{margin-top:30px;padding-top:24px;border-top:2px dashed var(--rule);display:flex;align-items:center;gap:20px;transform-origin:0 50%;}
  .qt2 .note .tile{width:68px;height:68px;border-radius:20px;}
  .qt2 .note .tile svg{width:36px;height:36px;}
  .qt2 .note .nt{font-family:var(--serif);font-size:54px;line-height:1.1;color:var(--ink);}
  .qt2 .note .nt b{font-weight:400;font-style:italic;color:var(--accent-deep);}
  .qt2 .note .nt .op{color:var(--muted);margin:0 .18em;}

  /* cite (caption bar at the foot, across the content column) */
  .cite{left:var(--cl);top:auto;bottom:var(--cite-b);width:var(--cw);transform-origin:50% 100%;}
  .cite .bar{position:relative;display:flex;align-items:center;gap:28px;padding:26px 40px 28px 32px;border-radius:26px;background:linear-gradient(135deg,#2c2826 0%,#1f1e1d 58%,#181716 100%);box-shadow:0 24px 54px rgba(31,30,29,.30),0 3px 8px rgba(31,30,29,.16);overflow:hidden;box-sizing:border-box;}
  .cite .bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,#e7a283,var(--accent-deep));}
  .cite .ci{width:82px;height:82px;border-radius:22px;background:rgba(245,240,232,.07);box-shadow:inset 0 0 0 1.5px rgba(232,191,169,.22);color:#ecb39a;display:flex;align-items:center;justify-content:center;flex:none;}
  .cite .ci svg{width:44px;height:44px;stroke-width:1.9;}
  .cite .ctx{min-width:0;flex:1;}
  .cite .tag{font-weight:800;font-size:24px;letter-spacing:4.5px;color:#eaa588;text-transform:uppercase;line-height:1.2;margin-bottom:9px;white-space:nowrap;}
  .cite .nm{font-family:var(--serif);font-style:italic;font-size:52px;line-height:1.1;color:#f7f1e8;text-wrap:balance;}
  .cite .cn{font-weight:600;font-size:31px;letter-spacing:.7px;color:rgba(247,241,232,.74);margin-top:9px;line-height:1.2;}

  /* equation */
  .eq{left:var(--cl);width:var(--cw);}
  .eq .col{display:flex;flex-direction:column;align-items:center;}
  .eq .tw{position:relative;width:var(--eq-w);height:116px;}
  .eq .tw.res{height:134px;}
  .eq .slot{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:30px;border:3px dashed rgba(179,87,63,.30);box-sizing:border-box;}
  .eq .blk{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:48px;letter-spacing:3px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);box-shadow:0 20px 44px rgba(60,40,25,.12),0 3px 8px rgba(60,40,25,.05);text-transform:uppercase;white-space:nowrap;box-sizing:border-box;}
  .eq .res .blk{font-size:54px;color:#fffaf3;background:linear-gradient(120deg,#c9714f 0%,var(--accent) 46%,var(--accent-deep) 100%);border:none;box-shadow:0 26px 60px rgba(179,87,63,.38),0 4px 10px rgba(120,50,30,.14);}
  .eq .op{width:74px;height:74px;border-radius:50%;background:var(--wash);color:var(--accent-deep);font-weight:800;font-size:48px;line-height:1;display:flex;align-items:center;justify-content:center;margin:14px 0;box-shadow:inset 0 0 0 1.5px rgba(179,87,63,.18);flex:none;}
  .eq .ray{position:absolute;left:50%;top:50%;width:44px;height:7px;margin:-3.5px 0 0 -22px;border-radius:4px;background:var(--accent);}
  .eq .glow{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:30px;}

  /* bundle */
  .bdl{left:0;width:var(--pw);height:1080px;}
  .bdl .fct{position:absolute;left:0;top:0;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:34px;background:var(--paper);border:1.5px solid var(--rule);box-shadow:0 16px 34px rgba(60,40,25,.15),0 2px 6px rgba(60,40,25,.06);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .bdl .fct svg{width:62px;height:62px;stroke-width:1.9;}
  .bdl svg.cord{position:absolute;left:0;top:0;width:var(--pw);height:1080px;overflow:visible;}
  .bdl .ring0{fill:none;stroke:rgba(179,87,63,.38);stroke-width:3.4;stroke-dasharray:3 17;stroke-linecap:round;}
  .bdl .rope{fill:none;stroke:url(#ropeg);stroke-width:11;stroke-linecap:round;}
  .bdl .rope2{fill:none;stroke:rgba(255,236,220,.55);stroke-width:2.8;stroke-linecap:round;}
  .bdl .bow path{fill:none;stroke:url(#ropeg);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;}
  .bdl .bow path.lp{fill:rgba(245,223,208,.9);}
  .bdl .bow circle{fill:var(--accent-deep);}
  .bdl .lab{position:absolute;left:var(--cl);width:var(--cw);text-align:center;font-size:82px;line-height:1.1;color:var(--ink);}

  /* lower third (presenter side: inside x 0..PX with --lt-x margins, below the face) */
  .lt{position:absolute;left:var(--lt-x);top:var(--lt-y);height:108px;}
  .lt .ltc{position:relative;height:108px;border-radius:22px;background:var(--paper);box-shadow:0 16px 38px rgba(10,8,6,.30),0 2px 6px rgba(10,8,6,.16);overflow:hidden;display:flex;align-items:center;padding:0 42px 0 30px;gap:20px;box-sizing:border-box;}
  .lt .bar{position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,var(--brand),var(--accent-deep));}
  .lt .mk{width:60px;height:60px;flex:none;}
  .lt .nm{font-size:54px;line-height:1;color:var(--ink);white-space:nowrap;}
  .lt .rl{font-weight:700;font-size:23px;letter-spacing:1px;color:var(--accent-deep);margin-top:6px;white-space:nowrap;line-height:1.2;}
  /* a name / role too long even at the smallest sizes wraps inside the widest card; the card grows upwards */
  .lt.wrap{height:auto;}
  .lt.wrap .ltc{width:var(--lt-w);height:auto;min-height:108px;padding-top:16px;padding-bottom:16px;}
  .lt.wrap .ltc > div:last-child{min-width:0;flex:1;}
  .lt.wrap .nm,.lt.wrap .rl{white-space:normal;}
  .lt.wrap .nm{line-height:1.04;}

  /* full-frame cards (sting / endcard) */
  .full{position:absolute;left:0;top:0;width:1920px;height:1080px;}
  .full .card2{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--cream);overflow:hidden;}
  .full .fbl,.full .fveil{position:absolute;left:0;top:0;width:1920px;height:1080px;}
  .full .fw{position:absolute;left:0;top:0;border-radius:50%;}
  .full .fw1{width:1500px;height:1500px;background:radial-gradient(circle,rgba(245,223,208,.95) 0%,rgba(245,223,208,.42) 36%,rgba(245,223,208,0) 66%);}
  .full .fw2{width:1600px;height:1600px;background:radial-gradient(circle,rgba(255,252,246,.95) 0%,rgba(255,252,246,.5) 34%,rgba(255,252,246,0) 64%);}
  .full .fst{position:absolute;left:0;top:0;width:940px;height:940px;overflow:visible;}
  .full .fst path{fill:none;stroke:var(--accent);stroke-width:2;opacity:.16;}
  .full .fst circle{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:2 12;opacity:.26;}
  .full .ct{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform-origin:50% 50%;}
  .full .lk{display:flex;align-items:center;gap:20px;}
  .full .lk .mk{width:84px;height:84px;flex:none;filter:drop-shadow(0 10px 22px rgba(120,60,30,.25));}
  .full .tt{font-size:224px;line-height:.98;letter-spacing:-1px;color:var(--ink);white-space:nowrap;}
  .full .ul{width:190px;height:6px;border-radius:3px;background:var(--copper);margin-top:28px;transform-origin:50% 50%;}
  /* the moving edge carries a light shadow (onto the presenter) only while it travels: no line, gone once the card lands */
  .full .edge{position:absolute;left:0;top:0;width:var(--edge-w);height:1080px;}
  .full .edge .esh{position:absolute;left:0;top:0;width:100%;height:1080px;background:linear-gradient(90deg,rgba(15,12,9,0) 0%,rgba(15,12,9,.05) 55%,rgba(15,12,9,.15) 100%);}
  .sting .kick{display:flex;align-items:center;gap:26px;font-weight:800;font-size:28px;letter-spacing:9px;color:var(--accent-deep);text-transform:uppercase;margin-top:66px;line-height:1.3;}
  .sting .kick span{margin-right:-9px;}
  .sting .kick i{display:block;width:72px;height:2px;background:var(--accent-soft);}
  .sting .tt{margin-top:22px;}
  .sting .sb{font-weight:500;font-size:44px;line-height:1.3;color:#5c5650;margin-top:34px;}
  .endc .lk .mk{width:96px;height:96px;}
  .endc .tt{font-size:176px;margin-top:46px;}
  .endc .nx{display:flex;align-items:center;gap:24px;margin-top:44px;}
  .endc .nx .tag{font-weight:800;font-size:24px;letter-spacing:5px;color:var(--accent-deep);background:var(--wash);border-radius:26px;padding:12px 21px 12px 26px;text-transform:uppercase;line-height:1.1;box-shadow:inset 0 0 0 1.5px rgba(179,87,63,.16);}
  .endc .nx .v{font-family:var(--serif);font-size:66px;line-height:1.05;color:var(--ink);white-space:nowrap;}
  .endc .nx .v b{font-weight:400;font-style:italic;color:var(--accent-deep);}
  .endc .url{display:flex;align-items:center;gap:16px;margin-top:56px;background:var(--ink);color:#f7f1e8;border-radius:44px;padding:18px 36px 18px 26px;font-weight:700;font-size:36px;letter-spacing:1px;line-height:1.1;box-shadow:0 18px 40px rgba(31,30,29,.25);}
  .endc .url svg{width:36px;height:36px;color:#ecb39a;}
</style></head>

const rise = (el, p, px) => { el.style.opacity = f4(clamp(p * 1.6)); el.style.transform = `translateY(${f2((1 - outExpo(p)) * px)}px)`; };
const wipeIn = (el, p) => { el.style.clipPath = p >= 1 ? 'none' : `inset(-30% ${f2((1 - p) * 100)}% -30% -4%)`; };

    if (y.c.type === 'cite' && overlaps(y.c, c)) bottom = Math.min(bottom, y.top - GAP);
    if (y.c.type === 'kicker' && overlaps(y.c, c)) top = Math.max(top, y.bottom + GAP); }

function fitFont(el, ok, minPx, step = 2) { let fs = parseFloat(getComputedStyle(el).fontSize); let n = 0;
  while (!ok() && fs > minPx && n++ < 60) { fs -= step; el.style.fontSize = fs + 'px'; } return fs; }

  if (lineCount(el) <= 1) return; fs = fs0; el.style.fontSize = fs + 'px';
  while (lineCount(el) > maxLines && fs > minPx) { fs -= 2; el.style.fontSize = fs + 'px'; } }

const BUILD = {}, LAYOUT = {}, SEEK = {};

/* ---------------- 2 panel (chrome + the seam feather) ---------------- */
BUILD.panel = (c) => {
  const el = mk(pbase, 'pchrome', `<div class="pbg"><div class="pbl"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <svg class="wst" viewBox="-340 -340 680 680"><circle r="318"/><path d="${starPath(270)}"/><path class="s2" d="${starPath(150)}"/></svg></div><div class="pveil"></div><div class="pramp"></div></div>
    <div class="phead"><div class="plk">${markHTML()}${wordmarkHTML(31)}</div><div class="chip"><div class="face"><div class="num"></div><div class="lab"></div></div></div></div>
    <div class="prule"><div class="fill"></div></div>`);
  const fe = mk(pedge, 'feather');   // presenter side of the seam: shown with the panel, never moved by it
  const sc = (c.scenes || []).map(s => { const label = String(s.label ?? ''); const m = label.match(/^\s*(\d{1,2})\s*[·.:|–—-]\s*(.+)$/);
    return { at: s.at, num: m ? m[1] : '', txt: m ? m[2] : label }; }).sort((a, b) => a.at - b.at);
  return { el, el2: fe, sc, q: { b1: $(el, '.b1'), b2: $(el, '.b2'), b3: $(el, '.b3'), wst: $(el, '.wst'), lk: $(el, '.plk'), chip: $(el, '.chip'), face: $(el, '.face'),
    num: $(el, '.num'), lab: $(el, '.lab'), rule: $(el, '.prule'), fill: $(el, '.fill'), fe } };
};
function setFace(x, s) { const q = x.q; q.num.textContent = s.num; q.num.style.display = s.num ? '' : 'none'; q.face.classList.toggle('nonum', !s.num); q.face.classList.toggle('tight', !!s.tight); q.lab.textContent = s.txt; }
// frame x of the endcard's left edge: it opens on the seam and widens over the presenter (shared with the panel waiting under it)
const endcardX = (c, t) => PX * (1 - inOutCubic(P(t, c.t0 + 0.06, 0.55)));
LAYOUT.panel = (x) => {
  const c = x.c, q = x.q, wd = $(q.lk, '.wd');
  const fit = () => { const maxW = CW - q.lk.offsetWidth - 28;
    x.sc.forEach(s => { s.tight = false; setFace(x, s); s.w = Math.ceil(q.face.offsetWidth);
      if (s.w > maxW) { s.tight = true; setFace(x, s); s.w = Math.ceil(q.face.offsetWidth); } });
    return x.sc.every(s => s.w <= maxW); };
  if (!fit()) { wd.style.display = 'none'; fit(); }   // very long scene label: mark-only lockup
  x.cur = null;
  const st = EL.find(y => y.c.type === 'sting' && y.c.t0 <= c.t0 + 0.01 && y.c.t1 > c.t0);
  x.coverEnd = st ? st.c.t1 : null;
  const ec = EL.find(y => y.c.type === 'endcard' && y.c.t0 <= c.t1 && y.c.t0 >= c.t1 - 1.2);
  x.coverStart = ec ? ec.c.t0 : null;
  // keep the chrome and the seam feather under the endcard until the card is opaque (0.16 s) and its edge has passed the feather,
  // or the header pops out mid-fade / the feather strip blinks off at the edge
  let end = c.t1;
  if (ec) { end = Math.max(c.t1, ec.c.t0 + 0.2); while (endcardX(ec.c, end) > PX - FEATHER - 8 && end < ec.c.t0 + 2) end += 1 / 96; }
  x.end = end;
  x.hb = x.coverEnd != null ? x.coverEnd - 0.06 : c.t0 + 0.35;   // header build start
};
SEEK.panel = (x, t) => {
  const c = x.c, q = x.q;
  let slide = 0;
  if (x.coverEnd == null) slide += (1 - outExpo(P(t, c.t0, 0.7))) * SLIDE;
  if (x.coverStart == null) slide += inCubic(P(t, c.t1 - 0.45, 0.45)) * SLIDE;
  x.slide = slide;
  q.fe.style.opacity = f4(1 - clamp(slide / SLIDE));   // the feather fades with a sliding panel instead of travelling with it
  // living background: blob centres in panel coords, all towards the right (the mask keeps CLEAR px at the seam flat anyway)
  const blob = (el, w, bx, by) => { el.style.transform = `translate(${f2(OVER + bx - w / 2)}px,${f2(OVER + by - w / 2)}px)`; };
  blob(q.b1, 1000, PW - 150 + 70 * Math.sin(TAU * t / 26), 140 + 50 * Math.cos(TAU * t / 21));
  blob(q.b2, 1100, PW * 0.5 + 60 * Math.cos(TAU * t / 31), 930 + 60 * Math.sin(TAU * t / 27));
  blob(q.b3, 820, PW - 170 + 50 * Math.sin(TAU * t / 35 + 1), 990 + 40 * Math.cos(TAU * t / 29));
  q.wst.style.transform = `translate(${f2(OVER + PW - 120 - 340 + 14 * Math.sin(TAU * t / 40))}px,${f2(OVER + 990 - 340 + 10 * Math.cos(TAU * t / 33))}px) rotate(${f4(t * 1.6)}deg)`;
  const a1 = P(t, x.hb, 0.55), a2 = P(t, x.hb + 0.1, 0.75);
  q.lk.style.opacity = f4(outCubic(a1)); q.lk.style.transform = `translateY(${f2((1 - outExpo(a1)) * -18)}px)`;
  q.rule.style.transform = `scaleX(${f4(outExpo(a2))})`;
  q.fill.style.width = f4(clamp((t - c.t0) / Math.max(1, c.t1 - c.t0)) * 100) + '%';
  // scene chip with a quick flip between labels
  const sc = x.sc; let i = -1; for (let k = 0; k < sc.length; k++) if (t >= sc[k].at) i = k;
  if (i < 0) { q.chip.style.opacity = '0'; return; }
  const FL = 0.5, ft = t - sc[i].at; let lab = sc[i], rot = 0, w = sc[i].w;

/* ---------------- 1 sting / 15 endcard (full frame, top layer) ---------------- */
function fullBG() { return `<div class="fbl"><div class="fw fw1"></div><div class="fw fw2"></div><svg class="fst" viewBox="-470 -470 940 940"><circle r="452"/><path d="${starPath(390)}"/></svg></div><div class="fveil"></div>`; }
BUILD.sting = (c) => {
  const el = mk(topL, 'full sting', `<div class="card2">${fullBG()}<div class="ct"><div class="lk">${markHTML()}${wordmarkHTML(46)}</div>
      ${c.kicker ? `<div class="kick"><i></i><span>${esc(c.kicker)}</span><i></i></div>` : ''}
      <div class="tt serif">${connHTML(c.title)}</div><div class="ul"></div>${c.sub ? `<div class="sb">${esc(c.sub)}</div>` : ''}</div></div>
    <div class="edge"><div class="esh"></div></div>`);
  return { el, q: { card: $(el, '.card2'), ct: $(el, '.ct'), fveil: $(el, '.fveil'), fw1: $(el, '.fw1'), fw2: $(el, '.fw2'), fst: $(el, '.fst'), edge: $(el, '.edge') } };
};
function fullLiving(q, t) {
  q.fw1.style.transform = `translate(${f2(1180 + 60 * Math.sin(TAU * t / 17))}px,${f2(-640 + 40 * Math.cos(TAU * t / 13))}px)`;
  q.fw2.style.transform = `translate(${f2(160 + 50 * Math.cos(TAU * t / 19))}px,${f2(-260 + 40 * Math.sin(TAU * t / 23))}px)`;
  q.fst.style.transform = `translate(${f2(1300)}px,${f2(380)}px) rotate(${f4(t * 2.2)}deg)`;
}
// the card's moving left edge at frame x X: a light shadow falls onto the presenter, at opacity o (callers fade it with the motion).
// The card's own living blobs are veiled near that edge as the panel's are near the seam, in proportion to how close the edge is to
// the seam (X / PX): the card lands on / leaves the seam cream-on-cream, and keeps its untouched full-frame look at X = 0.
const edgeSpeed = (p) => 4 * Math.pow(Math.min(clamp(p), 1 - clamp(p)), 2);   // speed of an inOutCubic move, 0..1 (0 at both ends)
function edgeAt(q, X, o) {
  q.edge.style.transform = `translateX(${f2(X - EDGE_W)}px)`; q.edge.style.opacity = f4(o);
  const k = clamp(X / PX);
  q.fveil.style.background = k < 0.001 ? 'none' : `linear-gradient(90deg,rgba(245,240,232,${f4(k)}) ${f2(X + CLEAR)}px,rgba(245,240,232,0) ${f2(X + CLEAR + RAMP)}px)`;
}
// compose2's base is its black lead until presenter_start, which build_split_plan.py sets STING_LEAD s before the sting ends:
// the wipe must not open before then (opening at t1 - 0.45 showed a 2 px, then a 16 px black sliver at the left edge, frames 37-38)
const STING_LEAD = 0.35;
SEEK.sting = (x, t) => {
  const c = x.c, q = x.q, D = c.t1 - c.t0;
  const ex = c.t1 - Math.min(0.55, D * 0.4);          // exit starts
  const ws = Math.max(ex + 0.1, c.t1 - STING_LEAD);   // wipe starts
  const pc = P(t, ex, 0.34), pw = P(t, ws, Math.max(0.2, c.t1 - ws));
  const life = 1 + 0.014 * P(t, c.t0, Math.max(0.5, ex - c.t0));
  fullLiving(q, t);
  q.ct.style.opacity = f4(1 - inCubic(pc));
  q.ct.style.transform = `translateX(${f2(inCubic(pc) * 240)}px) scale(${f4(life * (1 - 0.07 * inCubic(pc)))})`;
  const X = inOutCubic(pw) * PX;                        // the card retracts onto the panel, the presenter appears on the left
  q.card.style.clipPath = X > 0.5 ? `inset(0 0 0 ${f2(X)}px)` : 'none';
  edgeAt(q, X, edgeSpeed(pw));                          // shadow only while travelling: none when it lands on the seam
  x.el.style.opacity = f4(1 - P(t, c.t1 - 0.1, 0.1));
};
BUILD.endcard = (c) => {
  let sub = '';
  if (c.sub) { const m = String(c.sub).match(/^\s*([^:]{1,24}):\s*(.+)$/);
    sub = m ? `<div class="nx"><span class="tag">${esc(m[1])}</span><span class="v">${opsHTML(m[2])}</span></div>` : `<div class="nx"><span class="v">${opsHTML(c.sub)}</span></div>`; }
  const el = mk(topL, 'full endc', `<div class="card2">${fullBG()}<div class="ct"><div class="lk">${markHTML()}${wordmarkHTML(52)}</div>
      <div class="tt serif">${maskWords(c.title)}</div><div class="ul"></div>${sub}
      ${c.url ? `<div class="url">${ico('globe')}<span>${esc(c.url)}</span></div>` : ''}</div></div>
    <div class="edge"><div class="esh"></div></div>`);
  return { el, q: { card: $(el, '.card2'), ct: $(el, '.ct'), fveil: $(el, '.fveil'), fw1: $(el, '.fw1'), fw2: $(el, '.fw2'), fst: $(el, '.fst'), edge: $(el, '.edge'),
    lk: $(el, '.lk'), words: $$(el, '.wi'), ul: $(el, '.ul'), nx: $(el, '.nx'), url: $(el, '.url') } };
};
SEEK.endcard = (x, t) => {
  const c = x.c, q = x.q, t0 = c.t0;
  fullLiving(q, t);
  const a = P(t, t0, 0.16), pw = P(t, t0 + 0.06, 0.55);
  const X = endcardX(c, t);                             // the card widens from the seam over the presenter
  q.card.style.clipPath = X > 0.5 ? `inset(0 0 0 ${f2(X)}px)` : 'none';
  q.card.style.opacity = f4(a);
  edgeAt(q, X, a * edgeSpeed(pw));                      // no shadow while the edge still sits on the seam, none once it lands
  rise(q.lk, P(t, t0 + 0.34, 0.6), 26);
  q.words.forEach((w, k) => { const p = P(t, t0 + 0.42 + k * 0.09, 0.6), e = outExpo(p);

  q.ul.style.transform = `scaleX(${f4(outExpo(P(t, t0 + 0.72, 0.6)))})`;

/* ---------------- 14 lower third (presenter side: inside x 0..PX, below the face) ---------------- */
BUILD.lower_third = (c) => {

};
LAYOUT.lower_third = (x) => {   // the card stays inside the presenter third (LT_X margins): name, then role narrow; failing that they wrap
  const q = x.q, fits = () => q.ltc.offsetWidth <= LT_W, h0 = q.ltc.offsetHeight;
  fitFont(q.nm, fits, 40, 2); if (q.rl) fitFont(q.rl, fits, 18, 1);

/* ---------------- 3 title ---------------- */
BUILD.title = (c) => {
  const el = mk(pcontent, 'cue ttl', `<div class="h serif">${maskWords(c.title)}</div><div class="ul"></div>${c.sub ? `<div class="s">${esc(c.sub)}</div>` : ''}`);

/* ---------------- 4 question ---------------- */
BUILD.question = (c) => {
  const rw = richWords(c.text, c.hl ? [c.hl] : [], 'hlq');
  const el = mk(pcontent, 'cue qa', `<div class="qcard card"><div class="qt serif">${rw.html}</div></div><div class="ring"></div><div class="badge">${ico('message-circle-question')}</div>`);
  return { el, nW: rw.nWords, q: { card: $(el, '.qcard'), qt: $(el, '.qt'), words: $$(el, '.w'), hls: $$(el, '.hlq'), badge: $(el, '.badge'), ring: $(el, '.ring') } };
};
LAYOUT.question = (x) => {
  const A = areaFor(x.c), q = x.q;
  fitFont(q.qt, () => q.qt.scrollWidth <= q.qt.clientWidth + 1 && x.el.offsetHeight <= (A.bottom - A.top) * 0.7, 60, 2);

SEEK.question = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0;
  const pb = P(t, c.t0 + 0.05, 0.6), dock = outExpo(P(t, at - 0.04, 0.6));
  const bx = x.bdx * (1 - dock), by = x.bdy * (1 - dock), bs = lerp(1.45, 1, dock);
  q.badge.style.opacity = f4(clamp(pb * 4));
  q.badge.style.transform = `translate(${f2(bx)}px,${f2(by)}px) scale(${f4(bs * spring(pb))}) rotate(${f2((1 - outCubic(pb)) * -40)}deg)`;
  if (t < at + 0.25) { const ph = ((t - c.t0) % 1.0) / 1.0;
    q.ring.style.opacity = f4(0.55 * (1 - ph) * clamp((at + 0.1 - t) / 0.2) * clamp(pb * 2)); q.ring.style.transform = `translate(${f2(bx)}px,${f2(by)}px) scale(${f4(bs * (1 + 0.8 * outCubic(ph)))})`; }

  q.words.forEach(w => { const k = +w.dataset.w, p = P(t, at + 0.14 + k * 0.05, 0.34);
    w.style.opacity = f4(outCubic(p)); w.style.top = f2((1 - outCubic(p)) * 24) + 'px'; });
  const ph = P(t, at + 0.2 + x.nW * 0.05 + 0.12, 0.5);
  q.hls.forEach(h => { h.style.color = mixC('#1f1e1d', '#b3573f', outCubic(ph)); h.style.backgroundSize = `${f2(outCubic(ph) * 100)}% 8px`; });

/* ---------------- 5 stamp ---------------- */
BUILD.stamp = (c) => {
  const el = mk(pcontent, 'cue stamp', `<div class="si"><div class="l1">${esc(c.line1)}</div>${c.line2 ? `<div class="l2">${esc(c.line2)}</div>` : ''}</div>`);

LAYOUT.stamp = (x) => {
  const c = x.c, at = c.at ?? c.t0, si = x.q.si;
  const qx = EL.find(y => y.c.type === 'question' && y.c.t0 <= at && y.c.t1 >= at);
  fitFont(si, () => si.offsetWidth <= CW - 200, 34, 2);
  const w = si.offsetWidth, h = si.offsetHeight;
  const cy = c.y ?? (qx ? qx.top + qx.h + 16 : Math.round((AREA_TOP + AREA_BOTTOM) / 2));
  const cx = CX + 12;                                   // a hair right of the column centre: the -9 deg tilt then reads centred
  si.style.left = f2(cx - w / 2) + 'px'; si.style.top = f2(cy - h / 2) + 'px';

};
SEEK.stamp = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0;
  const p = P(t, at, STAMP_FALL), tau = t - at - STAMP_FALL; let s, r, dx = 0, dy = 0;
  if (tau < 0) { const e = p * p; s = x.s0 - (x.s0 - 1) * e; r = -22 + 13 * e; dx = STAMP_FROM[0] * (1 - e); dy = STAMP_FROM[1] * (1 - e); }
  else { const d = Math.exp(-9 * tau); s = 1 - 0.05 * d * Math.sin(30 * tau); r = -9 + 1.3 * d * Math.sin(24 * tau); }
  q.si.style.opacity = f4(clamp(p * 3.5));
  q.si.style.transform = `translate(${f2(dx)}px,${f2(dy)}px) rotate(${f2(r)}deg) scale(${f4(s)})`;

function shakeAt(t) {   // brief panel shake after each stamp lands (the panel cream overscans by OVER, so no edge ever shows)

    if (tau < 0 || tau > 0.7 || t > x.c.t1) continue; const A = Math.exp(-7.5 * tau);

  return { sx, sy, sr };
}

/* ---------------- 6 list ---------------- */
BUILD.list = (c) => {
  const items = c.items || [];
  const headHTML = c.head ? esc(c.head).replace(/(\d+(?:\s+\w+)?)/, '<em>$1</em>') : '';
  const el = mk(pcontent, 'cue lst', `${c.head ? `<div class="lh serif">${headHTML}</div><div class="lul"></div>` : ''}<div class="items"><div class="hlbar"></div>${items.map(it => `<div class="it"><div class="nb">${esc(it.n ?? '')}</div><div class="tx serif">${esc(it.text)}</div></div>`).join('')}</div>`);
  return { el, q: { lh: $(el, '.lh'), lul: $(el, '.lul'), items: $(el, '.items'), bar: $(el, '.hlbar'), its: $$(el, '.it'), nb: $$(el, '.nb'), tx: $$(el, '.tx') } };
};
LAYOUT.list = (x) => {
  const A = areaFor(x.c), q = x.q;
  if (q.lh) fitFont(q.lh, () => q.lh.scrollWidth <= CW + 1 && q.lh.offsetHeight < 1.6 * parseFloat(getComputedStyle(q.lh).fontSize), 60, 2);
  // text ends clear of the pill's round cap; every item takes the size of the one that had to shrink most (one type size per list)
  const fs = q.tx.map(tx => fitFont(tx, () => tx.offsetLeft + tx.offsetWidth <= CW - 24, 46, 2));
  if (fs.length) { const m = Math.min(...fs); q.tx.forEach(tx => { tx.style.fontSize = m + 'px'; }); }
  x.rowY = q.its.map(it => it.offsetTop);
  const rh = q.its.length ? q.its[0].offsetHeight : 0, nh = q.nb.length ? q.nb[0].offsetHeight : 0;
  q.seg = [];
  for (let k = 0; k + 1 < q.its.length; k++) { const s = mk(q.items, 'seg'); const y0 = x.rowY[k] + rh / 2 + nh / 2 + 4, y1 = x.rowY[k + 1] + rh / 2 - nh / 2 - 4;
    s.style.top = y0 + 'px'; s.style.height = Math.max(0, y1 - y0) + 'px'; q.items.insertBefore(s, q.its[0]); q.seg.push(s); }
  x.el.style.top = (x.c.y ?? centerTop(A, x.el.offsetHeight, -20)) + 'px';
};
SEEK.list = (x, t) => {
  const c = x.c, q = x.q, items = c.items || [], ha = c.head_at ?? c.t0;
  if (q.lh) { rise(q.lh, P(t, ha, 0.6), 38); q.lul.style.transform = `scaleX(${f4(outExpo(P(t, ha + 0.3, 0.6)))})`; }
  const ats = items.map((it, k) => it.at ?? (ha + 0.6 + k * 0.6)); let act = -1;
  items.forEach((it, k) => { const at = ats[k]; if (t >= at) act = k;
    const pb = P(t, at, 0.62); q.nb[k].style.opacity = f4(clamp(pb * 4));
    q.nb[k].style.transform = `scale(${f4(spring(pb))}) rotate(${f2((1 - outCubic(pb)) * -110)}deg)`;
    const pt = P(t, at + 0.07, 0.55); q.tx[k].style.opacity = f4(clamp(pt * 2.2)); q.tx[k].style.transform = `translateX(${f2((1 - outExpo(pt)) * 70)}px)`; });
  q.seg.forEach((s, k) => { s.style.transform = `scaleY(${f4(outCubic(P(t, ats[k + 1] - 0.15, 0.4)))})`; });
  if (act >= 0) { const p = outExpo(P(t, ats[act], 0.5)); const y = act > 0 ? lerp(x.rowY[act - 1], x.rowY[act], p) : x.rowY[0];
    q.bar.style.transform = `translateY(${f2(y)}px) scaleX(${f4(act > 0 ? 1 : 0.35 + 0.65 * p)})`; q.bar.style.opacity = f4(act > 0 ? 1 : clamp(p * 1.5)); }
  else q.bar.style.opacity = '0';
  cueRoot(x, t, { from: ha });
};

/* ---------------- 7 strike / 8 point ---------------- */
BUILD.strike = (c) => {
  const el = mk(pcontent, 'cue stk', `<div class="row card"><div class="tile">${ico(c.icon || 'book-open')}</div><div class="tx serif">${esc(c.text)}</div></div>`);
  return { el, q: { row: $(el, '.row'), tile: $(el, '.tile'), tx: $(el, '.tx') } };
};
LAYOUT.strike = (x) => {
  const A = areaFor(x.c), q = x.q;
  fitLines(q.tx, 56, 2, 46);
  // one strike bar per rendered line of text
  const r = document.createRange(); r.selectNodeContents(q.tx); const box = q.tx.getBoundingClientRect(); const lines = [];
  for (const rc of r.getClientRects()) { if (rc.width < 2) continue; const L = lines.find(l => Math.abs(l.top - rc.top) < 6);
    if (L) { L.left = Math.min(L.left, rc.left); L.right = Math.max(L.right, rc.right); L.bottom = Math.max(L.bottom, rc.bottom); } else lines.push({ top: rc.top, bottom: rc.bottom, left: rc.left, right: rc.right }); }
  q.bars = lines.map(L => { const b = mk(q.tx, 'sbar'); b.style.left = f2(L.left - box.left - 7) + 'px'; b.style.width = f2(L.right - L.left + 14) + 'px';
    b.style.top = f2((L.top + L.bottom) / 2 - box.top + 8) + 'px'; return b; });
  const h = x.el.offsetHeight;
  const pt = EL.find(y => y.c.type === 'point' && overlaps(y.c, x.c));
  x.yAlone = x.c.y ?? centerTop(A, h, -20);
  // the partner point's text is fitted first, so its real height sets the pair
  if (pt) { fitPoint(pt); const ph = pt.el.offsetHeight, gap = 50; const top0 = x.c.y ?? centerTop(A, h + gap + ph, -20);
    x.yPaired = top0; pt.paired = true; pt.top = top0 + h + gap; pt.el.style.top = pt.top + 'px'; x.pairAt = pt.c.at ?? pt.c.t0; }
  else { x.yPaired = x.yAlone; x.pairAt = null; }
  x.el.style.top = x.yAlone + 'px';
};
SEEK.strike = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0, sa = c.strike_at ?? (at + 1.5);
  const p = P(t, at, 0.6);
  q.row.style.opacity = f4(clamp(p * 2.5));
  q.row.style.transform = `translateY(${f2((1 - outExpo(p)) * 52)}px) scale(${f4(0.94 + 0.06 * outBack(p))})`;
  const pi = P(t, at + 0.08, 0.6); q.tile.style.transform = `scale(${f4(spring(pi))})`;
  wipeIn(q.tx, outCubic(P(t, at + 0.1, 0.5)));
  (q.bars || []).forEach((b, j) => { b.style.transform = `scaleX(${f4(outCubic(P(t, sa + j * 0.16, 0.38)))}) rotate(-1.2deg)`; });
  const g = outCubic(P(t, sa + 0.18, 0.45));
  q.tx.style.color = mixC('#1f1e1d', '#a59f97', g); q.tile.style.color = mixC('#b3573f', '#a59f97', g);
  q.tile.style.background = g > 0 ? `rgba(${Math.round(lerp(245, 236, g))},${Math.round(lerp(223, 231, g))},${Math.round(lerp(208, 223, g))},1)` : '';
  const dy = x.pairAt != null ? (x.yPaired - x.yAlone) * outExpo(P(t, x.pairAt - 0.1, 0.6)) : 0;
  cueRoot(x, t, { dy, from: at });
};
BUILD.point = (c) => {
  const el = mk(pcontent, 'cue pt' + (c.accent ? ' acc' : ''), `<div class="row card"><div class="tile">${ico(c.icon || 'check')}</div><div class="tx serif">${esc(c.text)}</div>${c.accent ? '<div class="sheen"></div>' : ''}</div>`);
  return { el, q: { row: $(el, '.row'), tile: $(el, '.tile'), tx: $(el, '.tx'), sheen: $(el, '.sheen') } };
};
function fitPoint(x) { if (!x.fitted) { fitLines(x.q.tx, 62, 2, 48); x.fitted = true; } }
LAYOUT.point = (x) => {
  const q = x.q; fitPoint(x);
  x.rowW = q.row.offsetWidth;   // the sheen crosses the whole row
  if (x.paired) return;   // placed under its strike line
  const A = areaFor(x.c); x.top = x.c.y ?? centerTop(A, x.el.offsetHeight, -20); x.el.style.top = x.top + 'px';
};
SEEK.point = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0, p = P(t, at, 0.62);
  q.row.style.opacity = f4(clamp(p * 2.5));
  q.row.style.transform = `translateY(${f2((1 - outExpo(p)) * 60)}px) scale(${f4(0.9 + 0.1 * outBack(p))})`;
  q.tile.style.transform = `scale(${f4(spring(P(t, at + 0.1, 0.6)))}) rotate(${f2((1 - outCubic(P(t, at + 0.1, 0.6))) * -30)}deg)`;
  wipeIn(q.tx, outCubic(P(t, at + 0.12, 0.5)));
  if (q.sheen) { const s = P(t, at + 0.45, 0.75); q.sheen.style.transform = `translateX(${f2(lerp(-260, x.rowW + 80, inOutCubic(s)))}px) skewX(-18deg)`; q.sheen.style.opacity = s > 0 && s < 1 ? '1' : '0'; }
  cueRoot(x, t, { from: at });
};

/* ---------------- 9 kicker ---------------- */
BUILD.kicker = (c) => {
  const el = mk(pcontent, 'cue kck', `<div class="bar"></div><div class="tx">${esc(c.text)}</div>`);
  return { el, q: { bar: $(el, '.bar'), tx: $(el, '.tx') } };
};
LAYOUT.kicker = (x) => { if (x.c.y != null) x.el.style.top = x.c.y + 'px'; x.bottom = x.el.offsetTop + x.el.offsetHeight; };
SEEK.kicker = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0;
  q.bar.style.transform = `scaleX(${f4(outExpo(P(t, at, 0.45)))})`;
  const p = outCubic(P(t, at + 0.1, 0.55)); wipeIn(q.tx, p); q.tx.style.transform = `translateX(${f2((1 - p) * -12)}px)`;
  cueRoot(x, t, { noLife: true });
};

/* ---------------- 10 quote ---------------- */
BUILD.quote = (c) => {
  const rw = richWords(c.text, c.hl || [], 'hlw');
  let note = '';
  if (c.note && c.note.text) { const m = String(c.note.text).match(/^(.*?)\s*(=|≠|→|:)\s*(.*)$/);
    note = `<div class="note"><div class="tile">${ico('corner-left-up')}</div><div class="nt">${m ? `<b>${esc(m[1])}</b><span class="op">${esc(m[2])}</span>${esc(m[3])}` : esc(c.note.text)}</div></div>`; }
  const el = mk(pcontent, 'cue qt2', `<div class="qc card"><div class="qm">&ldquo;</div><div class="body serif">${rw.html}</div>${note}</div>`);
  return { el, rw, q: { qc: $(el, '.qc'), qm: $(el, '.qm'), body: $(el, '.body'), words: $$(el, '.w'), hls: $$(el, '.hlw'), note: $(el, '.note') } };
};
LAYOUT.quote = (x) => {
  const A = areaFor(x.c), q = x.q, top = x.c.y ?? (A.top + QM_ROOM);
  fitFont(q.body, () => x.el.offsetHeight <= A.bottom - top, 44, 2);
  x.el.style.top = top + 'px';
  // reveal schedule: by character offset, so long words take longer
  const at = x.c.at ?? x.c.t0, rev = Math.max(0.4, x.c.reveal ?? 3), n = Math.max(1, x.rw.nChars);
  x.wordT = x.rw.wordC0.map(c0 => at + 0.3 + (rev - 0.3) * 0.94 * (c0 / n));
  x.hlT = q.hls.map(h => { const ws = $$(h, '.w').map(w => +w.dataset.w); return Math.max(...ws.map(k => x.wordT[k])) + 0.22; });
  // the note explains a highlighted phrase that shares a word with it
  x.noteH = -1;
  if (x.c.note && x.c.note.text) { const nw = String(x.c.note.text).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 3);
    q.hls.forEach((h, j) => { if (x.noteH < 0 && nw.some(w => h.textContent.toLowerCase().includes(w))) x.noteH = j; }); }
};
SEEK.quote = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0, p = P(t, at, 0.6);
  q.qc.style.opacity = f4(clamp(p * 2.5));
  q.qc.style.transform = `translateY(${f2((1 - outExpo(p)) * 62)}px) scale(${f4(0.95 + 0.05 * outBack(p))})`;
  const pm = P(t, at + 0.12, 0.6); q.qm.style.opacity = f4(clamp(pm * 3)); q.qm.style.transform = `scale(${f4(spring(pm))}) rotate(${f2((1 - outCubic(pm)) * -16)}deg)`;
  q.words.forEach(w => { const k = +w.dataset.w, pw = P(t, x.wordT[k], 0.3);
    w.style.opacity = f4(outCubic(pw)); w.style.top = f2((1 - outCubic(pw)) * 16) + 'px'; });
  q.hls.forEach((h, j) => { const ph = outCubic(P(t, x.hlT[j], 0.45));
    let pulse = 0; if (j === x.noteH && c.note) pulse = Math.sin(Math.PI * P(t, c.note.at, 0.6));
    h.style.color = mixC('#1f1e1d', '#b3573f', ph); h.style.backgroundSize = `${f2(ph * 100)}% ${f2(44 + 22 * pulse)}%`; });
  if (q.note) { const pn = P(t, c.note.at, 0.6); q.note.style.opacity = f4(clamp(pn * 3));
    q.note.style.transform = `translateY(${f2((1 - outExpo(pn)) * 18)}px) scale(${f4(0.8 + 0.2 * spring(pn))})`; }
  cueRoot(x, t, { from: at });
};

/* ---------------- 11 cite (caption bar at the foot of the content column) ---------------- */
BUILD.cite = (c) => {
  const s = String(c.text ?? ''); const m = s.match(/^(.*?)[\s,]*([\[(]\d{4}[\])].*)$/);
  const name = m && m[1] ? m[1] : s, cit = m && m[1] ? m[2] : '';
  const el = mk(pcontent, 'cue cite', `<div class="bar"><div class="ci">${ico(c.icon || 'scale')}</div><div class="ctx">${c.tag ? `<div class="tag">${esc(c.tag)}</div>` : ''}<div class="nm">${esc(name)}</div>${cit ? `<div class="cn">${esc(cit)}</div>` : ''}</div></div>`);
  return { el, q: { bar: $(el, '.bar'), ci: $(el, '.ci'), tag: $(el, '.tag'), nm: $(el, '.nm'), cn: $(el, '.cn') } };
};
LAYOUT.cite = (x) => {
  const q = x.q; fitLines(q.nm, 46, 2, 36);
  if (q.tag) fitFont(q.tag, () => q.tag.scrollWidth <= q.tag.clientWidth + 1, 18, 1);
  x.h = q.bar.offsetHeight; x.top = 1080 - CITE_B - x.h;
};
function linkCites() {   // a citation that starts as another ends takes over its bar
  const cs = EL.filter(x => x.c.type === 'cite');
  for (const b of cs) for (const a of cs) if (a !== b && a.c.t0 < b.c.t0 && Math.abs(a.c.t1 - (b.c.at ?? b.c.t0)) <= 0.35 && !a.hout && !b.hin) { a.hout = b; b.hin = a; }
}
SEEK.cite = (x, t) => {
  const c = x.c, q = x.q, at = c.at ?? c.t0, FO = c.fade_out ?? 0.3, k = clamp((c.t1 - t) / FO);
  let by = 0, bo = 1, h = null;
  if (!x.hin) { const p = P(t, at, 0.6); by = (1 - outExpo(p)) * 110; bo = clamp(p * 3); }
  else { const p = P(t, at - 0.02, 0.45); if (p < 1) h = lerp(x.hin.h, x.h, inOutCubic(p)); }
  let co = 1, cy = 0;
  if (x.hout) { co = k; cy = -(1 - k) * 18; } else { by += (1 - k) * (1 - k) * 80; bo *= k; }
  q.bar.style.height = h != null ? f2(h) + 'px' : '';
  q.bar.style.transform = `translateY(${f2(by)}px)`; q.bar.style.opacity = f4(bo);
  const d = x.hin ? -0.08 : 0.12;   // a hand-over brings the new text in slightly early, over the old text's lift-out (no empty bar)
  const pi = P(t, at + d, 0.55); q.ci.style.opacity = f4(clamp(pi * 3) * co); q.ci.style.transform = `translateY(${f2(cy)}px) scale(${f4(spring(pi))}) rotate(${f2((1 - outCubic(pi)) * -30)}deg)`;
  if (q.tag) { wipeIn(q.tag, outCubic(P(t, at + d + 0.06, 0.5))); q.tag.style.opacity = f4(co); q.tag.style.transform = `translateY(${f2(cy)}px)`; }
  const pn = P(t, at + d + 0.12, 0.55); q.nm.style.opacity = f4(clamp(pn * 1.6) * co); q.nm.style.transform = `translateY(${f2((1 - outExpo(pn)) * 24 + cy)}px)`;
  if (q.cn) { const pc = P(t, at + d + 0.24, 0.5); q.cn.style.opacity = f4(clamp(pc * 1.6) * co); q.cn.style.transform = `translateY(${f2((1 - outExpo(pc)) * 16 + cy)}px)`; }
};

/* ---------------- 12 equation ---------------- */
BUILD.equation = (c) => {
  const terms = c.terms || []; let html = '<div class="col">';
  terms.forEach((tm, k) => { if (tm.op) html += `<div class="op">${esc(tm.op)}</div>`;
    html += `<div class="tw${tm.result ? ' res' : ''}"><div class="slot"></div><div class="glow"></div><div class="blk"><span>${esc(tm.text)}</span></div>${tm.result ? Array.from({ length: 16 }, () => '<div class="ray"></div>').join('') : ''}</div>`; });
  const el = mk(pcontent, 'cue eq', html + '</div>');
  const tws = $$(el, '.tw');
  return { el, q: { tws, slots: tws.map(w => $(w, '.slot')), blks: tws.map(w => $(w, '.blk')), glows: tws.map(w => $(w, '.glow')), rays: tws.map(w => $$(w, '.ray')), ops: $$(el, '.op') } };
};
LAYOUT.equation = (x) => {
  const A = areaFor(x.c); x.q.blks.forEach(b => fitFont(b, () => b.firstElementChild.offsetWidth <= b.clientWidth - 72, 28, 2));
  x.el.style.top = (x.c.y ?? centerTop(A, x.el.offsetHeight, -6)) + 'px';
  let oi = 0; x.opOf = (x.c.terms || []).map(tm => tm.op ? x.q.ops[oi++] : null);
  x.rayR = x.q.tws.map(w => [w.offsetWidth / 2 + 66, w.offsetHeight / 2 + 21]);   // ray burst ellipse just outside each block
};
SEEK.equation = (x, t) => {
  const c = x.c, q = x.q, terms = c.terms || [];
  terms.forEach((tm, k) => {
    const at = tm.at ?? (c.t0 + 0.5 + k * 1.2), op = x.opOf[k];
    q.slots[k].style.opacity = f4(clamp(P(t, c.t0 + k * 0.1, 0.4) * 1.5) * (1 - P(t, at + 0.1, 0.25)));
    if (op) { const po = P(t, at - 0.06, 0.5); op.style.opacity = f4(clamp(po * 3)); op.style.transform = `scale(${f4(spring(po))}) rotate(${f2((1 - outCubic(po)) * -120)}deg)`; }
    const pb = P(t, at + (op ? 0.08 : 0), tm.result ? 0.5 : 0.6), b = q.blks[k];
    b.style.opacity = f4(clamp(pb * 3));
    b.style.transform = tm.result ? `scale(${f4(1.3 - 0.3 * spring(pb, 7, 12))})` : `translateY(${f2((1 - outExpo(pb)) * 46)}px) scale(${f4(0.86 + 0.14 * outBack(pb))})`;
    if (tm.result) { const land = at + 0.08 + 0.12, g = P(t, land, 0.75);
      q.glows[k].style.boxShadow = g > 0 && g < 1 ? `0 0 0 ${f2(outCubic(g) * 34)}px rgba(204,120,92,${f4(0.38 * (1 - g))})` : 'none';
      const n = q.rays[k].length, pr = P(t, land, 0.62), [rx, ry] = x.rayR[k];
      q.rays[k].forEach((r, j) => { const ang = (j / n) * TAU + 0.2, ex = rx + 40 * outCubic(pr), ey = ry + 46 * outCubic(pr);
        r.style.opacity = pr > 0 && pr < 1 ? f4(1 - pr) : '0';
        r.style.transform = `translate(${f2(Math.cos(ang) * ex)}px,${f2(Math.sin(ang) * ey)}px) rotate(${f2(Math.atan2(Math.sin(ang) * ey, Math.cos(ang) * ex) * 180 / Math.PI)}deg) scaleX(${f4(1 - 0.7 * pr)})`; });
      // gentle living pulse once it has landed
      const lv = t > land + 0.75 ? 0.5 + 0.5 * Math.sin(TAU * (t - land) / 2.4) : 0;
      b.style.boxShadow = `0 ${f2(26 + 6 * lv)}px ${f2(60 + 14 * lv)}px rgba(179,87,63,${f4(0.36 + 0.1 * lv)}),0 4px 10px rgba(120,50,30,.14)`; }
  });
  cueRoot(x, t);
};

/* ---------------- 13 bundle ---------------- */
BUILD.bundle = (c) => {
  const icons = c.icons && c.icons.length ? c.icons : ['file-text'];
  const el = mk(pcontent, 'cue bdl', `<svg class="cord"><circle class="ring0"/><path class="rope"/><path class="rope2"/><g class="bow"><path class="lp l1"/><path class="lp l2"/><path class="tl t1"/><path class="tl t2"/><circle r="10"/></g></svg>${icons.map(n => `<div class="fct">${ico(n)}</div>`).join('')}<div class="lab serif">${connHTML(c.label)}</div>`);
  return { el, q: { ics: $$(el, '.fct'), ring0: $(el, '.ring0'), rope: $(el, '.rope'), rope2: $(el, '.rope2'), bow: $(el, '.bow'), lab: $(el, '.lab') } };
};
LAYOUT.bundle = (x) => {
  const A = areaFor(x.c), q = x.q, n = q.ics.length, R = n <= 7 ? BDL_R[0] : BDL_R[1];
  // the finished composition (cord ring, bow, label under it) is centred in the free band, scaled down about (cx, cy) by fs if a big
  // bundle would not fit
  const up = R + 8, down = R + BDL_LAB + q.lab.offsetHeight, avail = A.bottom - A.top;

  x.cx = cx; x.cy = cy; x.R = R;
  // tight cluster: centre + ring of 6 (+ outer ring)
  x.home = q.ics.map((_, k) => { if (k === 0) return [cx, cy]; const ring = k <= 6 ? 1 : 2, idx = ring === 1 ? k - 1 : k - 7, cnt = ring === 1 ? Math.min(6, n - 1) : n - 7;
    const a = -Math.PI / 2 + (idx / cnt) * TAU + (ring === 2 ? Math.PI / cnt : 0), r = BDL_RING[ring - 1]; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
  // loose scatter while "many" facts arrive
  const ang = (k) => -Math.PI / 2 + ((k - 1) / Math.max(1, n - 1)) * TAU + 0.35;
  x.loose = q.ics.map((_, k) => { if (k === 0) return [cx, cy]; const a = ang(k), j = ((k * 37) % 5) / 5;
    return [cx + Math.cos(a) * (BDL_LOOSE[0] + BDL_JIT[0] * j), cy + Math.sin(a) * (BDL_LOOSE[1] + BDL_JIT[1] * j)]; });
  // entry paths start beyond the panel's top, right or bottom FRAME edge - never the seam side, where a tile would seem to come out
  // of an invisible line beside the presenter - and never across the header row: upper tiles drop through the gap between the logo
  // lockup and the widest scene chip; a tile with no clear path pops in place. Worked out in screen space (the root scale fs).
  const pn = EL.find(y => y.c.type === 'panel'), half = (q.ics.length ? q.ics[0].offsetWidth / 2 : 64) * x.fs, hs = half * 1.3;   // 1.3: tilted tile
  const lkR = (pn ? CL + pn.q.lk.offsetWidth : CL + 360) + 12, chL = CL + CW - (pn ? Math.max(0, ...pn.sc.map(s => s.w || 0)) : 360) - 12;
  const headB = HEAD_Y + HEAD_H + 12;                                            // a tile whose top stays below this misses the header row
  const scr = ([X, Y]) => [cx + (X - cx) * x.fs, cy + (Y - cy) * x.fs], uns = ([X, Y]) => [cx + (X - cx) / x.fs, cy + (Y - cy) / x.fs];
  const clearsHead = (f, l) => [HEAD_Y - hs, HEAD_Y + HEAD_H + hs].every(y => {  // x where the path crosses the header band's top / bottom
    if (y < Math.min(f[1], l[1]) || y > Math.max(f[1], l[1])) return true;
    const xc = f[0] + (l[0] - f[0]) * (y - f[1]) / (l[1] - f[1]); return xc - hs >= lkR && xc + hs <= chL; });
  x.pop = q.ics.map(() => false);
  x.from = q.ics.map((_, k) => { if (k === 0) return [cx, cy];
    const sl = scr(x.loose[k]), a = ang(k), ca = Math.cos(a), sa = Math.sin(a);
    const right = [PW + half + 110, sl[1] + 110 * Math.max(0, sa)], rightOK = right[1] - hs > headB;
    let f = null;
    if (sa <= -0.55) f = [70, 0, 140, -70, 210].map(dx => [sl[0] + dx, -(half + 110)]).find(c => clearsHead(c, sl)) || (ca >= 0 && rightOK ? right : null);
    else if (ca >= 0.3) f = rightOK ? right : null;
    else f = [sl[0] + 60, 1080 + half + 110];                                    // from the bottom edge
    if (!f) { x.pop[k] = true; return x.loose[k]; }

  q.ring0.setAttribute('cx', cx); q.ring0.setAttribute('cy', cy); q.ring0.setAttribute('r', R);
  const d = `M ${cx} ${cy + R} A ${R} ${R} 0 1 1 ${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx} ${cy + R}`;
  for (const p of [q.rope, q.rope2]) { p.setAttribute('d', d); p.setAttribute('pathLength', '1'); p.style.strokeDasharray = '1 1'; }
  const B = q.bow;
  $(B, '.l1').setAttribute('d', 'M0 0 C -26 -40 -86 -40 -82 -2 C -78 30 -30 22 0 0 Z');
  $(B, '.l2').setAttribute('d', 'M0 0 C 26 -40 86 -40 82 -2 C 78 30 30 22 0 0 Z');
  $(B, '.t1').setAttribute('d', 'M0 0 C -10 24 -22 44 -40 64');
  $(B, '.t2').setAttribute('d', 'M0 0 C 10 24 24 44 36 66');

SEEK.bundle = (x, t) => {
  const c = x.c, q = x.q, n = q.ics.length;
  const one = c.one_at ?? c.t0 + 0.5, many = c.many_at ?? one + 1.2, gat = c.gather_at ?? many + 1.3;
  // dashed container ring: draws in at t0, turns slowly, gives way to the cord
  const r0 = P(t, c.t0, 0.7), rg = P(t, gat + 0.2, 0.35);
  q.ring0.style.opacity = f4(outCubic(r0) * (1 - rg)); q.ring0.style.strokeDashoffset = f2(-t * 16);
  q.ring0.style.transformOrigin = `${x.cx}px ${x.cy}px`; q.ring0.style.transform = `scale(${f4(0.86 + 0.14 * outExpo(r0) - 0.04 * outCubic(rg))})`;
  q.ics.forEach((el, k) => {
    let X, Y, s, rot = 0, o;
    const bob = Math.sin(TAU * (t * 0.55 + k * 0.17)), bob2 = Math.cos(TAU * (t * 0.43 + k * 0.29));
    if (k === 0) { const p = P(t, one, 0.6); o = clamp(p * 3); s = 1.3 * spring(p); if (t >= many) s = lerp(s, 1.12, outCubic(P(t, many, 0.6)));
      [X, Y] = x.loose[0]; Y += 6 * bob * (1 - P(t, gat, 0.4)); rot = (1 - outCubic(p)) * -25; }
    else if (x.pop[k]) { const p = P(t, many + (k - 1) * 0.09, 0.7); o = clamp(p * 3);   // no clear path in: springs up in place
      [X, Y] = x.loose[k]; s = spring(p) * (0.92 + 0.08 * outCubic(p)); rot = (1 - outCubic(p)) * (k % 2 ? 30 : -30) + 5 * bob2;
      X += 7 * bob2; Y += 9 * bob; }
    else { const p = P(t, many + (k - 1) * 0.09, 0.95), e = outCubic(p); o = clamp(p * 2.5);
      X = lerp(x.from[k][0], x.loose[k][0], e); Y = lerp(x.from[k][1], x.loose[k][1], e); s = 0.92 + 0.08 * e; rot = (1 - e) * (k % 2 ? 28 : -28) + 5 * bob2;
      X += 7 * bob2; Y += 9 * bob; }
    const pg = P(t, gat + k * 0.025, 0.55);
    if (pg > 0) { const e = outBack(pg, 1.3); X = lerp(X, x.home[k][0], e); Y = lerp(Y, x.home[k][1], e); rot = lerp(rot, 0, outCubic(pg)); s = lerp(s, 1, outCubic(pg)); }
    el.style.opacity = f4(o); el.style.transform = `translate(${f2(X)}px,${f2(Y)}px) rotate(${f2(rot)}deg) scale(${f4(s)})`;
  });
  const pc = P(t, gat + 0.18, 0.5), dash = 1 - inOutCubic(pc);
  q.rope.style.strokeDashoffset = f4(dash); q.rope2.style.strokeDashoffset = f4(dash);
  q.rope.style.opacity = pc > 0 ? '1' : '0'; q.rope2.style.opacity = pc > 0 ? '1' : '0';
  const pb = P(t, gat + 0.5, 0.6);
  q.bow.style.opacity = f4(clamp(pb * 4)); q.bow.style.transform = `translate(${x.cx}px,${x.cy + x.R}px) rotate(${f2((1 - outCubic(pb)) * -40)}deg) scale(${f4(BDL_BOW * spring(pb))})`;
  const pl = P(t, gat + 0.38, 0.6); rise(q.lab, pl, 34);
  const breathe = t > gat + 0.9 ? 1 + 0.008 * Math.sin(TAU * (t - gat) / 2.2) : 1;
  cueRoot(x, t, { noLife: true });
  x.el.style.transform += ` scale(${f4(breathe * x.fs)})`;
};

/* ---------------- runtime ---------------- */
async function init(tl) {
  TL = tl; EL = [];
  for (const e of [pbase, pcontent, pedge, pres, topL]) e.innerHTML = '';
  await Promise.all([document.fonts.load('400 100px "Instrument Serif"'), document.fonts.load('italic 400 100px "Instrument Serif"'),
    document.fonts.load('500 100px "Manrope"'), document.fonts.load('800 100px "Manrope"'), document.fonts.load('600 100px "Manrope"', '₹')]).catch(() => {});
  await document.fonts.ready;
  for (const c of tl.cues || []) { const b = BUILD[c.type]; if (!b) { console.warn('[split_panel] unknown cue type', c.type); continue; } const x = b(c); x.c = c; EL.push(x); }
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  // citations and kickers first: they define the free band for everything else; then the panel, whose header the bundle avoids
  EL.filter(x => x.c.type === 'cite' || x.c.type === 'kicker').forEach(x => LAYOUT[x.c.type](x));
  linkCites();
  EL.filter(x => x.c.type === 'panel').forEach(x => LAYOUT.panel(x));
  EL.filter(x => !['cite', 'kicker', 'panel'].includes(x.c.type)).forEach(x => LAYOUT[x.c.type] && LAYOUT[x.c.type](x));
  seek(-1);
  return EL.length;
}
function seek(t) {
  let active = false, slide = 0;
  for (const x of EL) {
    const c = x.c, on = t >= c.t0 && t <= (x.end ?? c.t1);
    vis(x.el, on); if (x.el2) vis(x.el2, on);
    if (!on) continue; active = true;
    SEEK[c.type](x, t);
    if (c.type === 'panel') slide = Math.max(slide, x.slide);
  }
  const sh = shakeAt(t);
  pwrap.style.transform = slide ? `translateX(${f2(slide)}px)` : '';
  pin.style.transform = `translate(${f2(sh.sx)}px,${f2(sh.sy)}px) rotate(${f4(sh.sr)}deg)`;
  return active;
}
window.__init = init; window.__seek = seek;
